<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Hive Template Importer{% endblock %}
    </title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="/static/favicon.svg"
    >

    <link
        rel="stylesheet"
        href="/static/app.css"
    >
</head>

<body>
    <header class="topbar">
        <div class="container">
            <a href="/" class="brand">
                Hive Template Importer
            </a>

            <nav>
                <a href="/">Templates</a>
                <a href="/import">Import</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
